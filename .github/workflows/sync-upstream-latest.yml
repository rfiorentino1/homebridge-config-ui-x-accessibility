name: Sync 'latest' from upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into latest
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -e
          response=$(gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/merge-upstream \
            -f branch=latest 2>&1) || rc=$?
          echo "$response"
          case "$response" in
            *'"merge_type":"fast-forward"'*) echo "fast-forwarded latest to upstream/latest" ;;
            *'"merge_type":"none"'*)         echo "already in sync"; exit 0 ;;
            *'"merge_type":"merge"'*)        echo "merged upstream into latest" ;;
            *) echo "unexpected response"; exit 1 ;;
          esac
