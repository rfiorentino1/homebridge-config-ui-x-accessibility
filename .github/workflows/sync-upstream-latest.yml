name: Sync 'latest' from upstream

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into latest
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          for attempt in 1 2 3; do
            response=$(gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/merge-upstream \
              -f branch=latest 2>&1) || true
            echo "$response"
            case "$response" in
              *'"merge_type":"fast-forward"'*) echo "fast-forwarded latest to upstream/latest"; exit 0 ;;
              *'"merge_type":"none"'*)         echo "already in sync"; exit 0 ;;
              *'"merge_type":"merge"'*)        echo "merged upstream into latest"; exit 0 ;;
              *'HTTP 409'*) echo "::error::merge conflict with upstream — needs manual attention"; exit 1 ;;
            esac
            echo "transient failure (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 90
          done
          echo "::error::still failing after 3 attempts"
          exit 1
